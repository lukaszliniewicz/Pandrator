# Pandrator's fixed JSONL security event stream. ISO-8601 dates use Fail2Ban's date detector.
# The address is emitted by Pandrator from its trusted request context, not a form field.
failregex = ^\{"timestamp":"[^"]*","event":"(?:authentication_failed|project_link_redemption_failed)","client_ip":"<HOST>","status":(?:401|403|404),"request_id":"[^"]*","route":"[^"]*","method":"POST"\}$
ignoreregex =
