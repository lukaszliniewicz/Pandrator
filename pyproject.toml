[build-system]
requires = ["hatchling>=1.32,<1.33"]
build-backend = "hatchling.build"

[project]
name = "pandrator"
version = "0.10.0"
description = "Browser-based audiobook, subtitle, and voiceover production workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "authlib>=1.7,<2",
  "cryptography>=43,<46",
  "flask>=3.1,<4",
  "google-auth>=2,<3",
  "beautifulsoup4>=4.12,<5",
  "deepl>=1.20,<2",
  "EbookLib>=0.18,<1",
  "ffmpeg-python>=0.2,<1",
  "hasami>=0.0.1,<1",
  "litellm>=1.100,<1.101",
  "mutagen>=1.47,<2",
  "numpy==1.26.4",
  "num2words>=0.5,<1",
  "Pillow>=10,<13",
  "pydub>=0.25,<1",
  "PyMuPDF>=1.25,<2",
  "regex>=2024.11",
  "sentence-splitter>=1.4,<2",
  "Unidecode>=1.3,<2",
  "wtpsplit-lite==0.2.0",
  "yt-dlp>=2026.8.19",
  "pydantic>=2.10,<3",
  "psutil>=6,<8",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
automation = ["pandrator-mcp[manager]>=0.3,<1"]
ocr = ["onnxruntime>=1.20,<2", "paddleocr==3.7.0"]
text-normalization = ["nemo-text-processing==1.2.0; sys_platform != 'win32'"]
credential-stores = ["keyring>=25,<26"]
dev = [
  "basedpyright==1.40.1",
  "build>=1.6,<2",
  "pytest>=8.3,<9",
  "pytest-xdist==3.8.0",
  "ruff==0.16.6",
  "vulture==2.16",
]

[project.scripts]
pandrator = "pandrator.web.cli:main"

[project.urls]
Homepage = "https://github.com/lukaszliniewicz/Pandrator"
Documentation = "https://github.com/lukaszliniewicz/Pandrator/tree/main/docs"
Repository = "https://github.com/lukaszliniewicz/Pandrator"
Issues = "https://github.com/lukaszliniewicz/Pandrator/issues"
Releases = "https://github.com/lukaszliniewicz/Pandrator/releases"

[tool.hatch.build.targets.wheel]
packages = ["pandrator"]
include = [
  "pandrator/web/static/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/tmp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
required-version = "==0.16.6"
target-version = "py311"
line-length = 100
extend-exclude = [".pixi", "build", "dist", "pandrator/web/static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.basedpyright]
include = ["pandrator", "pandrator_manager", "pandrator_mcp", "pandrator_installer"]
exclude = ["**/build", "**/dist", "**/.venv", "**/__pycache__", "pandrator/web/static"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
pythonPlatform = "All"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
failOnWarnings = true

[tool.vulture]
paths = ["pandrator", "pandrator_manager", "pandrator_mcp", "pandrator_installer", "scripts"]
exclude = ["*/build/*", "*/dist/*", "*/.venv/*", "*/.pixi/*"]
min_confidence = 100
