[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandrator-installer"
version = "0.5.9"
description = "Headless lifecycle manager and source-preparation compatibility entry point for Pandrator"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2026.10.23",
  "cryptography>=50.0.2,<51",
  "dulwich>=1.2.20,<2",
  "packaging>=26.3,<27",
  "psutil>=6,<8",
  "requests>=2.32,<3",
]

[project.scripts]
pandrator-installer = "pandrator_installer.lifecycle:main"

[tool.setuptools]
packages = ["pandrator_installer"]
package-dir = { pandrator_installer = "." }
