name: Documentation

on:
  push:
    paths:
      - ".github/workflows/docs.yml"
      - "**/*.md"
      - "scripts/check_docs.py"
      - "pixi.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "**/*.md"
      - "scripts/check_docs.py"
      - "pixi.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Local links and navigation
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tracked Markdown
        run: python scripts/check_docs.py
